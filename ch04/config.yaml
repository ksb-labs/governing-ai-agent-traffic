# Chapter 4 lab: Listing 4.3 pointed at the repo's stand-in model.
# Each model gets a baseUrl of http://localhost:8090/v1. params.model stays a
# real model name, because that's the name the gateway prices the call as.
# support-writer is sent as gpt-5.6 here, so all three aliases speak the
# OpenAI format the stand-in understands.
#
#   company/start.sh llm
#   export OPENAI_API_KEY=sk-placeholder
#   cd ch04 && agentgateway -f config.yaml
# yaml-language-server: $schema=https://agentgateway.dev/schema/config
llm:
  models:
  - name: support-writer
    provider: openAI
    params:
      model: gpt-5.6
      apiKey: "$OPENAI_API_KEY"
      baseUrl: "http://localhost:8090/v1"
  - name: classifier
    provider: openAI
    params:
      model: gpt-5.6-luna
      apiKey: "$OPENAI_API_KEY"
      baseUrl: "http://localhost:8090/v1"
  - name: local-private
    provider: openAI
    params:
      model: llama3
      baseUrl: "http://localhost:8090/v1"
