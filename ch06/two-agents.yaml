# Chapter 6 lab "Two agents, one port": the Hello World agent and the
# disputes agent on port 3000, each on its own path prefix. urlRewrite strips
# the prefix before the request reaches the agent, and the gateway rewrites
# each Agent Card to include it.
#
#   python3 company/disputes_agent.py &
#   cd ch06 && agentgateway -f two-agents.yaml
#   python3 tools/a2a_client.py send http://localhost:3000/disputes "dispute the 12 dollar fee"
# yaml-language-server: $schema=https://agentgateway.dev/schema/config
gateways:
  default:
    port: 3000
routes:
- name: disputes-agent
  matches:
  - path:
      pathPrefix: /disputes
  policies:
    urlRewrite:
      path:
        prefix: /
    a2a: {}
  backends:
  - host: localhost:9998
- name: hello-agent
  matches:
  - path:
      pathPrefix: /hello
  policies:
    urlRewrite:
      path:
        prefix: /
    a2a: {}
  backends:
  - host: localhost:9999
config:
  session:
    # Auto-generated by agentgateway to encode session IDs. Changing it invalidates existing sessions.
    key: e74c80755f0ff712fdd10c26a5e1b31a6d3511a89c52858ed7b2b89a8bcb1b58
