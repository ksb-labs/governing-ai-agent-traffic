# Listing 6.2: the A2A Hello World agent (port 9999) behind the gateway.
# Start the agent first; see Listing 6.1 or ch06/start-helloworld.sh.
# yaml-language-server: $schema=https://agentgateway.dev/schema/config
gateways:
  default:
    port: 3000
routes:
- name: disputes-agent
  policies:
    cors:
      allowOrigins: ["*"]
      allowHeaders: [content-type, cache-control]
    # Mark this route as A2A traffic
    a2a: {}
  backends:
  - host: localhost:9999
config:
  session:
    # Auto-generated by agentgateway to encode session IDs. Changing it invalidates existing sessions.
    key: 9ead304bb55e938fad6eb8da54a5ea6076c8290f9042fdfc1150789241f383be
