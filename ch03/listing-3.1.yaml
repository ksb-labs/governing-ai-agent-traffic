# Listing 3.1 exactly as printed. ledger.internal.example.com doesn't exist on
# your laptop, so /api/entries gets a 503 here. Use config.yaml for the lab.
# yaml-language-server: $schema=https://agentgateway.dev/schema/config
gateways:
  default:              # one port for all agent traffic
    port: 3000
    protocol: HTTP

# Tools: MCP traffic, served at /mcp on the default gateway
mcp:
  policies:
    cors:
      allowOrigins: ["*"]
      allowHeaders: [mcp-protocol-version, content-type, cache-control,
                     mcp-session-id]
      exposeHeaders: ["Mcp-Session-Id"]
  targets:
  - name: everything
    stdio:
      cmd: npx
      args: ["-y", "@modelcontextprotocol/server-everything"]

# Everything else: plain HTTP routes on the same gateway
routes:
- name: ledger-api
  matches:
  - path:
      pathPrefix: /api
  policies:
    backendTLS: {}      # port 443 expects HTTPS
  backends:
  - host: ledger.internal.example.com:443
