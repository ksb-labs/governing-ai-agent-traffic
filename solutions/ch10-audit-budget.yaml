# Chapter 10, Your turn: the hackathon key's budget in Audit mode.
# Delete ch10/agentgateway.db first, then run ten calls: all ten get 200, and
# the overrun is only recorded. Start every budget here, then switch to Block.
# Run it from the ch10 folder:  cd ch10 && agentgateway -f ../solutions/ch10-audit-budget.yaml
# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite://./agentgateway.db    # budgets are stored here
llm:
  policies:
    apiKey:
      mode: strict
      keys:
      - key: "$SUPPORT_AGENT_KEY"
        metadata: {name: support, agent: support, team: customer-care}
        budgets:
        - name: daily-spend
          limit:
            unit: USD
            amount: 50            # 50 US dollars...
          window:
            rolling: 24h          # ...per day (midnight to midnight UTC)
          onBudgetExceeded: Block
      - key: "$HACKATHON_AGENT_KEY"
        metadata: {name: hackathon, agent: hackathon, team: labs}
        allowedModels: ["classifier"]    # this key may only use one model
        budgets:
        - name: daily-spend
          limit:
            unit: USD
            amount: 0.001         # a tenth of a cent, for the lab
          window:
            rolling: 24h
          onBudgetExceeded: Audit     # record the overrun, block nothing
  models:
  - name: classifier
    provider: openAI
    params:
      model: gpt-5.6-luna
      apiKey: "$OPENAI_API_KEY"
      baseUrl: "http://localhost:8090/v1"
  - name: support-writer
    provider: openAI
    params:
      model: gpt-5.6
      apiKey: "$OPENAI_API_KEY"
      baseUrl: "http://localhost:8090/v1"
