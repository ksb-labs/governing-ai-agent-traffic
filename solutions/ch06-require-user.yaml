# Chapter 6, Your turn: refuse any message to the disputes agent that doesn't
# say which user it's for. Reading the card (a GET) still works without it.
# This only checks that a user is named, not that the name is true.
# Chapter 7 is how you make it true.
# yaml-language-server: $schema=https://agentgateway.dev/schema/config
gateways:
  default:
    port: 3000
routes:
- name: disputes-agent
  matches:
  - path:
      pathPrefix: /disputes
  policies:
    urlRewrite:
      path:
        prefix: /
    a2a: {}
    authorization:
      rules:
      - 'request.method == "GET" || "x-end-user" in request.headers'
  backends:
  - host: localhost:9998
- name: hello-agent
  matches:
  - path:
      pathPrefix: /hello
  policies:
    urlRewrite:
      path:
        prefix: /
    a2a: {}
  backends:
  - host: localhost:9999
